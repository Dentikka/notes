[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notes"
dynamic = ["version"]
description = "Music as code: an algebraic Python DSL, an exact intermediate representation and a DSP renderer for agent-driven composition."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
ears = ["torch>=2.6", "transformers>=4.45"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
notes = "notes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/notes/__init__.py"
